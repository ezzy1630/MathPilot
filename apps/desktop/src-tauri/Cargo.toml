[package]
name = "mathpilot"
version = "0.1.0"
description = "Private local-first calculus mastery engine"
authors = ["MathPilot"]
edition = "2021"

[lib]
name = "mathpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
