<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="MathPilot highlights">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5ec4"/>
      <stop offset="100%" stop-color="#1264d8"/>
    </linearGradient>
  </defs>

  <!-- Coach desk -->
  <g transform="translate(20 16)">
    <rect width="270" height="188" rx="16" fill="url(#card-bg)" stroke="#d6e4f7" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#accent)"/>
    <path d="M 38 38 L 50 38 L 50 50 L 38 50 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 42 44 L 46 48 L 54 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="42" fill="#0a4a9e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Coach desk</text>
    <text x="84" y="62" fill="#5a7a9e" font-family="system-ui, sans-serif" font-size="13">One next action</text>
    <text x="20" y="98" fill="#334155" font-family="system-ui, sans-serif" font-size="14">Blocker insight, evidence,</text>
    <text x="20" y="120" fill="#334155" font-family="system-ui, sans-serif" font-size="14">pace controls, quiet drawer</text>
  </g>

  <!-- Typeset math -->
  <g transform="translate(310 16)">
    <rect width="270" height="188" rx="16" fill="url(#card-bg)" stroke="#d6e4f7" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#accent)"/>
    <text x="44" y="50" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" text-anchor="middle">+</text>
    <text x="84" y="42" fill="#0a4a9e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Typeset math</text>
    <text x="84" y="62" fill="#5a7a9e" font-family="system-ui, sans-serif" font-size="13">MathLive + LaTeX</text>
    <text x="20" y="98" fill="#334155" font-family="system-ui, sans-serif" font-size="14">Prompts, hints, choices,</text>
    <text x="20" y="120" fill="#334155" font-family="system-ui, sans-serif" font-size="14">and examples rendered</text>
  </g>

  <!-- Codex-first -->
  <g transform="translate(600 16)">
    <rect width="270" height="188" rx="16" fill="url(#card-bg)" stroke="#d6e4f7" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#accent)"/>
    <circle cx="44" cy="44" r="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 44 38 L 44 44 L 48 48" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="84" y="42" fill="#0a4a9e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Codex-first</text>
    <text x="84" y="62" fill="#5a7a9e" font-family="system-ui, sans-serif" font-size="13">Works offline too</text>
    <text x="20" y="98" fill="#334155" font-family="system-ui, sans-serif" font-size="14">Coach, homework, maintenance</text>
    <text x="20" y="120" fill="#334155" font-family="system-ui, sans-serif" font-size="14">with deterministic fallbacks</text>
  </g>

  <!-- Native macOS -->
  <g transform="translate(890 16)">
    <rect width="270" height="188" rx="16" fill="url(#card-bg)" stroke="#d6e4f7" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#accent)"/>
    <rect x="30" y="30" width="28" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 30 36 L 58 36" stroke="#ffffff" stroke-width="2"/>
    <text x="84" y="42" fill="#0a4a9e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Native macOS</text>
    <text x="84" y="62" fill="#5a7a9e" font-family="system-ui, sans-serif" font-size="13">Tauri 2 shell</text>
    <text x="20" y="98" fill="#334155" font-family="system-ui, sans-serif" font-size="14">Python + SymPy bundled,</text>
    <text x="20" y="120" fill="#334155" font-family="system-ui, sans-serif" font-size="14">Vision OCR, command palette</text>
  </g>
</svg>
